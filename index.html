<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualisateur Excel - DFR Consulting</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
  <!-- Office.js -->
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js" type="text/javascript"></script>
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
  <!-- Notyf pour les notifications -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
</head>
<body class="light-theme">
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2><i data-feather="bar-chart-2"></i> Visualisateur</h2>
        <button class="btn btn-secondary btn-icon toggle-sidebar" aria-label="Réduire la barre latérale">
          <i data-feather="chevron-left"></i>
        </button>
      </div>

      <!-- Instructions -->
      <div class="card instructions-card">
        <div class="card-header">
          <i data-feather="zap"></i>
          <span>Guide rapide</span>
        </div>
        <ol class="instructions-list">
          <li><span class="step-number">1</span>Sélectionnez une table</li>
          <li><span class="step-number">2</span>Choisissez un type de graphique</li>
          <li><span class="step-number">3</span>Configurez les axes X/Y</li>
          <li><span class="step-number">4</span>Ajoutez une série</li>
        </ol>
      </div>

      <!-- Sélecteur de table -->
      <div class="form-group">
        <label for="tableSelector">
          <i data-feather="table"></i>
          Table Excel
        </label>
        <select id="tableSelector" class="form-select">
          <option value="" disabled selected>Choisir une table...</option>
        </select>
      </div>

      <!-- Types de graphiques -->
      <div class="form-group">
        <label>
          <i data-feather="layers"></i>
          Type de graphique
        </label>
        <div class="chart-type-container">
          <button class="chart-type-option selected" data-chart-type="xy" data-tooltip="Graphique XY (Nuage de points)" aria-label="Graphique XY">
            <i data-feather="scatter-chart"></i>
            <span class="chart-label">XY</span>
          </button>
          <button class="chart-type-option" data-chart-type="timeseries" data-tooltip="Série temporelle" aria-label="Série temporelle">
            <i data-feather="trending-up"></i>
            <span class="chart-label">Temps</span>
          </button>
          <button class="chart-type-option" data-chart-type="histogram" data-tooltip="Histogramme" aria-label="Histogramme">
            <i data-feather="bar-chart-2"></i>
            <span class="chart-label">Histo</span>
          </button>
          <button class="chart-type-option" data-chart-type="heatmap" data-tooltip="Heatmap" aria-label="Heatmap">
            <i data-feather="grid"></i>
            <span class="chart-label">Heatmap</span>
          </button>
        </div>
      </div>

      <!-- Sélecteurs d'axes -->
      <div class="form-group">
        <label for="xAxisSelect">
          <i data-feather="axis-3d"></i>
          Axe X
        </label>
        <div class="input-with-toggle">
          <select id="xAxisSelect" class="form-select"></select>
          <label class="toggle-switch" for="xIsDate">
            <input type="checkbox" id="xIsDate" class="toggle-input">
            <span class="toggle-slider"></span>
            <span class="toggle-text">Date</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="yAxisSelect">
          <i data-feather="axis-3d"></i>
          Axe Y1
        </label>
        <select id="yAxisSelect" class="form-select"></select>
      </div>

      <button class="btn btn-primary btn-full add-series-btn" data-axis="y1">
        <i data-feather="plus-circle"></i>
        Ajouter Série Y1
      </button>

      <!-- Groupe 2 (optionnel) -->
      <div id="group2Section" class="hidden fade-in">
        <div class="form-group">
          <label for="y2AxisSelect">
            <i data-feather="axis-3d"></i>
            Axe Y2
          </label>
          <select id="y2AxisSelect" class="form-select"></select>
        </div>
        <button class="btn btn-primary btn-full add-series-btn" data-axis="y2">
          <i data-feather="plus-circle"></i>
          Ajouter Série Y2
        </button>
      </div>

      <!-- Options de style -->
      <div class="card options-card">
        <div class="card-header">
          <i data-feather="settings"></i>
          <span>Options de style</span>
        </div>
        <div class="form-group">
          <label for="seriesColor">
            <i data-feather="palette"></i>
            Couleur Y1
          </label>
          <input type="color" id="seriesColor" value="#1E88A8" class="color-picker">
        </div>
        <div class="form-group" id="y2ColorGroup" class="hidden">
          <label for="seriesColorY2">
            <i data-feather="palette"></i>
            Couleur Y2
          </label>
          <input type="color" id="seriesColorY2" value="#FF5733" class="color-picker">
        </div>
        <div class="form-group">
          <label for="transparency">
            <i data-feather="eye"></i>
            Opacité (%)
          </label>
          <div class="slider-container">
            <input type="range" id="transparency" min="10" max="100" value="100" class="slider">
            <span class="slider-value" id="transparencyValue">100%</span>
          </div>
        </div>
      </div>

      <!-- Titres des axes -->
      <div class="card axes-card">
        <div class="card-header">
          <i data-feather="type"></i>
          <span>Titres des axes</span>
        </div>
        <div class="form-group">
          <label for="xAxisTitle">
            <i data-feather="axis-3d"></i>
            Titre X
          </label>
          <input type="text" id="xAxisTitle" class="form-input" placeholder="Titre de l'axe X">
        </div>
        <div class="form-group">
          <label for="y1AxisTitle">
            <i data-feather="axis-3d"></i>
            Titre Y1
          </label>
          <input type="text" id="y1AxisTitle" class="form-input" placeholder="Titre de l'axe Y1">
        </div>
        <div class="form-group hidden" id="y2TitleGroup">
          <label for="y2AxisTitle">
            <i data-feather="axis-3d"></i>
            Titre Y2
          </label>
          <input type="text" id="y2AxisTitle" class="form-input" placeholder="Titre de l'axe Y2">
        </div>
      </div>

      <!-- Actions -->
      <div class="actions-section">
        <button class="btn btn-secondary btn-full" id="clearAllBtn">
          <i data-feather="trash-2"></i>
          Tout effacer
        </button>
        <button class="btn btn-secondary btn-full" id="exportPNGBtn">
          <i data-feather="image"></i>
          Exporter PNG
        </button>
      </div>

      <!-- Toggle thème -->
      <div class="theme-toggle">
        <button class="btn btn-secondary btn-full" id="toggleTheme">
          <i data-feather="moon"></i>
          <span>Mode sombre</span>
        </button>
      </div>
    </div>

    <!-- Contenu principal -->
    <div class="main-content">
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="btn btn-primary" id="importBtn">
            <i data-feather="upload-cloud"></i>
            Importer Excel
          </button>
          <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" hidden>
        </div>
        <div class="toolbar-right">
          <button class="btn btn-secondary" id="resetBtn">
            <i data-feather="refresh-cw"></i>
            Réinitialiser
          </button>
        </div>
      </div>

      <div id="graphDiv">
        <div class="empty-state">
          <i data-feather="file-text"></i>
          <h3>Aucun graphique</h3>
          <p>Sélectionnez une table et configurez vos axes pour commencer</p>
          <div class="loading-spinner hidden" id="loadingSpinner">
            <div class="spinner"></div>
            <p>Chargement en cours...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tooltips container -->
  <div class="tooltip" id="tooltip"></div>

  <script src="app.js"></script>
</body>
</html>
